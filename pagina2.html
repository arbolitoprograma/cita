<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Qué te gustaría hacer?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
    <script defer src="script.js"></script>
</head>
<body>
    <section class="tarjeta" id="tarjeta-principal">
        <div class="tarjeta-sparkle" aria-hidden="true"></div>
        
        <img src="./MAPACHEBAILLARIN.gif" alt="Mapache bailarín" class="mapachebailarin">
        <h1 class="tarjeta-titulo">¿Qué te gustaría hacer?</h1>
       
        <div class="botones botones-grid" id="botones-respuesta">
            <button class="btn btn-si" id="btn-cine">
                <span>Cine 🍿</span>
            </button>
            <button class="btn btn-si" id="btn-comer">
                <span>Salir a comer 🍣</span>
            </button>
            <button class="btn btn-si" id="btn-prado">
                <span>Prado 👻</span>
            </button>
            <button class="btn btn-si" id="btn-cocino">
                <span>Te cocino 🧑‍🍳</span>
            </button>                                
        </div>
    </section>
</body>
</html>
